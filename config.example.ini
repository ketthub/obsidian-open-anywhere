; obsidian-open-anywhere (Windows) — configuration
; Copy this file to config.ini next to open-in-obsidian.py and edit values.
; All values are optional; defaults shown below are used when unset.

[obsidian]
; Absolute path to your Obsidian vault (required for the tool to work).
vault_path = C:\path\to\your\vault

; Vault name as shown in Obsidian. Defaults to the folder name of vault_path.
; vault_name =

; Subfolder inside the vault where external files are copied.
; Default: Inbox
inbox_subpath = Inbox

; Where the log file is written.
; Default: %LOCALAPPDATA%\obsidian-open-anywhere\obsidian-open-anywhere.log
; log_file =

; Space-separated list of allowed file extensions (without dot).
; Windows note: only .md is registered as a handled extension (see install.bat),
; but manual invocations accept any of these.
; Default: md markdown txt
allowed_extensions = md
